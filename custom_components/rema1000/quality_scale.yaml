rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: The shopping list every 2 minutes, the offer catalogues every 3 hours.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No requirements; the REMA 1000 and Tjek client is part of the integration (api.py).
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: There is no options flow; the meal plan settings in the panel are documented.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  discovery:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: A cloud service for REMA 1000 Denmark accounts, not devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One service device per REMA 1000 account.
  entity-category:
    status: done
    comment: Every entity is a primary feature (list, plan, offers); none is configuration or diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: There are few entities and all are used by the panel, dashboards or voice.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One service device per account; it is removed with the account.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
