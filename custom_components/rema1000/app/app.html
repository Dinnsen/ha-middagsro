<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="REMA 1000">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<title>REMA 1000</title>
<!-- REMA 1000 som app på hjemmeskærmen: logger ind med Home Assistant og viser
     samme panel som i sidebaren, i fuld skærm og i dit Home Assistant-tema. -->
<style>
  html, body { margin: 0; height: 100%; background: var(--primary-background-color); color: var(--primary-text-color);
    font-family: var(--ha-font-family-body, -apple-system, system-ui, Roboto, sans-serif); }
  /* Same set-up as the KatrineDinnsen Web launcher, which fills the whole screen on
     iPhone: a black status bar ("black-translucent" gives a page one status bar too
     short on iOS 26) and a fixed box of 100% x 100% that the page scrolls in. The
     page runs down behind the home bar; the panel pads its bottom by that much. */
  html, body { overflow: hidden; overscroll-behavior: none; }
  #wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: none; box-sizing: border-box;
    padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  #wrap > * { --rema-safe-top: env(safe-area-inset-top, 0px); --rema-safe-bottom: env(safe-area-inset-bottom, 0px); }
  #msg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center; }
  #msg img { width: 72px; height: 72px; border-radius: 16px; }
  #msg button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    background: var(--primary-color); color: var(--text-primary-color, #fff); }
  [hidden] { display: none !important; }
  /* Pull down at the top to refresh. */
  #pull { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 50%; z-index: 10; width: 40px; height: 40px;
    margin-left: -20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0;
    transform: translateY(-48px); pointer-events: none; color: var(--secondary-text-color);
    background: var(--card-background-color); box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
  #pull.ready { color: var(--primary-color); }
  #pull.back { transition: transform .25s ease, opacity .25s ease; }
  #pull svg { width: 22px; height: 22px; }
  #pull.busy svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="msg"><img src="icon-192.png?v=1" alt=""><div>Åbner REMA 1000 …</div></div>
<div id="wrap" hidden></div>
<div id="pull" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor"
  d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></div>
<script type="module">
import {
  getAuth, createConnection, ERR_INVALID_AUTH,
} from "https://cdn.jsdelivr.net/npm/home-assistant-js-websocket@9.4.0/+esm";

const KEY = "rema1000-hass-tokens";
const root = document.documentElement;
const msg = document.getElementById("msg");
const wrap = document.getElementById("wrap");

function say(text, retry) {
  msg.hidden = false;
  wrap.hidden = true;
  msg.querySelector("div").textContent = text;
  msg.querySelector("button")?.remove();
  if (retry) {
    const button = document.createElement("button");
    button.textContent = "Prøv igen";
    button.onclick = () => location.reload();
    msg.appendChild(button);
  }
}

const read = (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };

// ------------------------------------------------------------------ theme
// Home Assistant's own defaults, so the panel looks right before (and without) a theme.
const BASE = {
  light: {
    "primary-color": "#009ac7", "accent-color": "#ff9800", "text-primary-color": "#ffffff",
    "primary-text-color": "#141414", "secondary-text-color": "#5e5e5e", "disabled-text-color": "#bdbdbd",
    "primary-background-color": "#fafafa", "secondary-background-color": "#e5e5e5",
    "card-background-color": "#ffffff", "divider-color": "rgba(0, 0, 0, .12)",
    "error-color": "#db4437", "warning-color": "#ffa600", "success-color": "#43a047", "info-color": "#039be5",
  },
  dark: {
    "primary-color": "#009ac7", "accent-color": "#ff9800", "text-primary-color": "#ffffff",
    "primary-text-color": "#e1e1e1", "secondary-text-color": "#9b9b9b", "disabled-text-color": "#6f6f6f",
    "primary-background-color": "#111111", "secondary-background-color": "#282828",
    "card-background-color": "#1c1c1c", "divider-color": "rgba(225, 225, 225, .12)",
    "error-color": "#ef5350", "warning-color": "#ffa600", "success-color": "#43a047", "info-color": "#039be5",
  },
};
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
let themes = null;
let selected = null;
let applied = [];

function applyTheme() {
  let name = selected?.theme;
  const dark = typeof selected?.dark === "boolean" ? selected.dark : darkQuery.matches;
  if (!name || name === "default") name = (dark && themes?.default_dark_theme) || themes?.default_theme;
  const theme = (name && themes?.themes?.[name]) || {};
  const { modes, ...flat } = theme;
  const vars = { ...BASE[dark ? "dark" : "light"], ...flat, ...(modes?.[dark ? "dark" : "light"] || {}) };
  if (selected?.primaryColor) vars["primary-color"] = selected.primaryColor;
  if (selected?.accentColor) vars["accent-color"] = selected.accentColor;
  for (const key of applied) root.style.removeProperty(`--${key}`);
  applied = Object.keys(vars);
  for (const [key, value] of Object.entries(vars)) root.style.setProperty(`--${key}`, String(value));
  root.style.colorScheme = dark ? "dark" : "light";
  const header = getComputedStyle(root).getPropertyValue("--app-header-background-color").trim()
    || getComputedStyle(root).getPropertyValue("--card-background-color").trim();
  document.querySelector('meta[name="theme-color"]').content = header;
}

// ------------------------------------------------------------------ start
async function start() {
  applyTheme();
  let auth;
  try {
    auth = await getAuth({
      hassUrl: location.origin,
      saveTokens: (tokens) => { try { localStorage.setItem(KEY, JSON.stringify(tokens)); } catch {} },
      loadTokens: async () => read(KEY) || read("hassTokens"),
    });
  } catch (err) {
    if (err === ERR_INVALID_AUTH) {
      try { localStorage.removeItem(KEY); } catch {}
      location.replace(location.pathname);
      return;
    }
    say("Kunne ikke logge ind i Home Assistant.", true);
    return;
  }
  if (location.search.includes("auth_callback")) history.replaceState(null, "", location.pathname);

  let conn;
  try {
    conn = await createConnection({ auth });
  } catch (err) {
    if (err === ERR_INVALID_AUTH) {
      try { localStorage.removeItem(KEY); } catch {}
      location.replace(location.pathname);
      return;
    }
    say("Home Assistant svarer ikke. Tjek forbindelsen.", true);
    return;
  }
  const ws = (message) => conn.sendMessagePromise(message);

  // The theme you chose in Home Assistant (in this browser, else your profile, else the default).
  try { themes = await ws({ type: "frontend/get_themes" }); } catch {}
  selected = read("selectedTheme");
  if (!selected) {
    try { selected = (await ws({ type: "frontend/get_user_data", key: "selectedTheme" }))?.value || null; } catch {}
  }
  applyTheme();
  darkQuery.addEventListener("change", applyTheme);
  conn.subscribeEvents(async () => {
    try { themes = await ws({ type: "frontend/get_themes" }); applyTheme(); } catch {}
  }, "themes_updated").catch(() => {});

  let panel;
  try {
    panel = (await ws({ type: "get_panels" })).rema1000;
  } catch {}
  const custom = panel?.config?._panel_custom;
  if (!custom?.module_url) {
    say("REMA 1000-integrationen er ikke sat op i Home Assistant.", true);
    return;
  }
  try {
    await import(custom.module_url);
  } catch {
    say("Panelet kunne ikke hentes.", true);
    return;
  }
  const element = document.createElement(custom.name || "rema1000-panel");
  element.panel = panel;
  element.narrow = innerWidth < 870;
  element.hass = { callWS: ws, connection: conn, auth };
  addEventListener("resize", () => { element.narrow = innerWidth < 870; });
  wrap.appendChild(element);
  setupPullToRefresh(async () => {
    if (conn.connected === false) {
      location.reload();
      return;
    }
    try { themes = await ws({ type: "frontend/get_themes" }); applyTheme(); } catch {}
    await Promise.all([
      element._load?.(false, true),
      element._tab === "favorites" ? element._loadFavs?.(true) : null,
    ]);
  });
  wrap.hidden = false;
  msg.hidden = true;
}

// ------------------------------------------------------------------ pull to refresh
function setupPullToRefresh(refresh) {
  const pull = document.getElementById("pull");
  const READY = 70;
  let start = null;
  let pulling = false;
  let distance = 0;
  let busy = false;
  const show = (dist, rotate) => {
    pull.style.transform = `translateY(${dist - 48}px) rotate(${rotate}deg)`;
    pull.style.opacity = String(Math.min(1, dist / 40));
  };
  const hide = () => {
    pull.classList.add("back");
    pull.classList.remove("ready", "busy");
    pull.style.transform = "translateY(-48px)";
    pull.style.opacity = "0";
  };
  wrap.addEventListener("touchstart", (ev) => {
    start = !busy && wrap.scrollTop <= 0 && ev.touches.length === 1
      ? { x: ev.touches[0].clientX, y: ev.touches[0].clientY } : null;
    pulling = false;
  }, { passive: true });
  wrap.addEventListener("touchmove", (ev) => {
    if (!start) return;
    const dy = ev.touches[0].clientY - start.y;
    const dx = ev.touches[0].clientX - start.x;
    if (!pulling) {
      if (dy > 8 && dy > Math.abs(dx) * 1.5 && wrap.scrollTop <= 0) {
        pulling = true;
        pull.classList.remove("back");
      } else if (Math.abs(dx) > 8 || dy < -8) {
        start = null;
      }
      return;
    }
    distance = Math.min(120, (dy - 8) * 0.55);
    pull.classList.toggle("ready", distance >= READY);
    show(distance, distance * 3);
  }, { passive: true });
  const end = async () => {
    if (!pulling) { start = null; return; }
    pulling = false;
    start = null;
    if (distance < READY) { hide(); return; }
    busy = true;
    pull.classList.add("back", "busy");
    show(56, 0);
    try { await refresh(); } finally {
      busy = false;
      hide();
    }
  };
  wrap.addEventListener("touchend", end, { passive: true });
  wrap.addEventListener("touchcancel", end, { passive: true });
}

start();
</script>
</body>
</html>
