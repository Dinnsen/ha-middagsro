search_products:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    query:
      required: true
      example: "letmælk"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box

add_items:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    items:
      required: true
      example: '[{"product_id": 20494, "amount": 2}, {"name": "Sæbe", "amount": 1}]'
      selector:
        object:

get_offers:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    catalog:
      default: current
      selector:
        select:
          translation_key: catalog
          options:
            - current
            - upcoming

generate_meal_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    start_date:
      example: "2026-10-18"
      selector:
        date:
    send:
      default: false
      selector:
        boolean:

send_meal_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    plan_id:
      selector:
        text:
    part:
      default: main
      selector:
        select:
          translation_key: send_part
          options:
            - main
            - late
            - all

register_purchase:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: middagsro
    amount:
      required: true
      example: 600
      selector:
        number:
          min: 0.01
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: kr.
    store:
      example: "REMA 1000"
      selector:
        text:
    date:
      example: "2026-10-25"
      selector:
        date:
    note:
      selector:
        text:
