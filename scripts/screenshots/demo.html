<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Middagsro – demo</title>
<!-- Shows the real panel with demo data and Home Assistant's look, for the README
     screenshots. Open with ?theme=light|dark&tab=plan|recipes|shopping|favorites|history|settings -->
<style>
  :root {
    --primary-color: #009ac7;
    --text-primary-color: #ffffff;
    --primary-background-color: #f5f6f8;
    --secondary-background-color: #eceff3;
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --primary-text-color: #15181c;
    --secondary-text-color: #5f6670;
    --divider-color: rgba(20, 24, 28, 0.1);
    --error-color: #d93a30;
    --warning-color: #e08a00;
    --success-color: #2f9e55;
    --ha-card-border-radius: 16px;
    --ha-card-box-shadow: 0 1px 2px rgba(20, 24, 28, 0.06), 0 4px 18px rgba(20, 24, 28, 0.05);
    --app-header-background-color: #f5f6f8;
    --app-header-text-color: #15181c;
    --header-height: 56px;
    --ha-font-family-body: Inter, system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --primary-color: #2bb6e3;
    --text-primary-color: #0b1218;
    --primary-background-color: #111316;
    --secondary-background-color: #1d2126;
    --card-background-color: #1a1d21;
    --ha-card-background: #1a1d21;
    --primary-text-color: #eef1f4;
    --secondary-text-color: #a3abb5;
    --divider-color: rgba(255, 255, 255, 0.1);
    --error-color: #ff6b5e;
    --warning-color: #f2a73b;
    --success-color: #5cc985;
    --ha-card-box-shadow: none;
    --app-header-background-color: #111316;
    --app-header-text-color: #eef1f4;
  }
  html, body { margin: 0; background: var(--primary-background-color); }
  ha-menu-button { display: none; }
</style>
<script src="demo-data.js"></script>
</head>
<body>
<script type="module">
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") || "light";
  await import("../../custom_components/middagsro/frontend/middagsro-panel.js");
  const D = window.DEMO;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const handlers = {
    "middagsro/state": () => D.state,
    "middagsro/plan": () => D.state.latest_plan,
    "middagsro/favorites": (msg) => {
      const next = msg.week === "next";
      const sale = (p) => p.is_advertised || p.is_campaign || p.price < p.normal_price - 0.01;
      return {
        week: msg.week,
        fallback: false,
        catalog: next ? { label: "Uge 44", valid_from: "2026-10-24T22:00:00+00:00" } : { label: "Uge 43" },
        products: D.remaFavorites,
        on_offer: next
          ? D.remaFavorites
              .filter((p) => p.upcoming_is_advertised)
              .map((p) => ({ ...p, price: p.upcoming_price, normal_price: p.price, is_advertised: true }))
          : D.remaFavorites.filter(sale),
      };
    },
    "middagsro/note": (msg) => ({ note: (D.state.note = msg.text) }),
    // REMA 1000's recipes (made up, in the shape the integration sends).
    "middagsro/rema_recipes/list": async (msg) => {
      await wait(200);
      const all = D.remaRecipes.filter((r) => (!msg.tag || r.tag === msg.tag) && (!msg.query || r.title.toLowerCase().includes(msg.query.toLowerCase())));
      const page = msg.page || 1;
      return { recipes: all.slice((page - 1) * 4, page * 4), page, last_page: Math.max(1, Math.ceil(all.length / 4)), total: all.length,
        tags: [{ id: "avis", title: "Avisopskrifter" }, { id: "aften", title: "Aftensmad" }, { id: "born", title: "Mad for børn" }, { id: "kodfri", title: "Kødfri" }] };
    },
    "middagsro/rema_recipes/get": (msg) => {
      const r = D.remaRecipes.find((x) => x.slug === msg.slug);
      return { id: null, name: r.title, type: r.vegetarian ? "vegetar" : "normal", servings: r.servings, active_minutes: 0, total_minutes: r.total_minutes || 0,
        ingredients: [
          { name: "kyllingeinderfilet", amount: "300 g", product: { id: 1, name: "KYLLINGEINDERFILET", underline: "300 GR. / DANSK" } },
          { name: "champignon", amount: "400 g", product: { id: 2, name: "CHAMPIGNON", underline: "400 GR. / DANMARK KL. 1" } },
          { name: "piskefløde", amount: "2,5 dl", product: { id: 3, name: "PISKEFLØDE 38%", underline: "250 ML. / REMA 1000" } },
          { name: "olivenolie", amount: "", product: { id: 4, name: "OLIVENOLIE", underline: "500 ML." }, basic: true },
        ],
        steps: [{ text: "Kog risene efter anvisningen på posen.", minutes: 0 }, { text: "Steg kyllingen gylden, og læg den til side.", minutes: 0 }],
        tip: "", rating: null, favorite: false, source: "rema", rema_slug: r.slug, image: r.image };
    },
    "middagsro/rema_recipes/plan": async () => { await wait(300); return D.state.latest_plan; },
    "middagsro/search": (msg) => (/kaffe/i.test(msg.query) ? D.coffee : D.search),
    // Swapping a dish, the basic items and adding products (made-up answers).
    "middagsro/swap/options": async (msg) => {
      await wait(Number(q.get("ai") || 5));
      const plan = D.state.latest_plan;
      const day = plan.days.find((d) => d.date === msg.date);
      return { plan_id: plan.id, date: day.date, dish: day.dish, options: D.swapOptions };
    },
    "middagsro/swap": async (msg) => {
      await wait(Number(q.get("ai") || 5));
      const plan = D.state.latest_plan;
      const day = plan.days.find((d) => d.date === msg.date);
      Object.assign(day, { dish: msg.option.dish, type: msg.option.type, total_minutes: msg.option.total_minutes });
      return plan;
    },
    "middagsro/pantry": () => D.pantry,
    "middagsro/send": (msg) => {
      const plan = D.state.latest_plan;
      const lines = plan.shopping.filter((l) => !l.sent && !l.buy_at && (msg.part === "late") === !!l.buy_from);
      const at = new Date().toISOString();
      lines.forEach((l) => (l.sent = at));
      plan.last_sent = { at, ids: lines.map((l) => l.id) };
      plan.status = "sent";
      return { plan_id: plan.id, status: "sent" };
    },
    "middagsro/send/restore": () => {
      const plan = D.state.latest_plan;
      const ids = new Set(plan.last_sent?.ids || []);
      plan.shopping.forEach((l) => ids.has(l.id) && delete l.sent);
      delete plan.last_sent;
      return { plan_id: plan.id };
    },
    "middagsro/chains/rema_add": (msg) => {
      const plan = D.state.latest_plan;
      plan.shopping.push({ id: `o${Date.now()}`, name: msg.offer.heading, category: "Tilføjet", added: true, packages: 1, cost: msg.offer.price,
        avis_item: { name: msg.offer.heading, underline: msg.offer.description, price: msg.offer.price, is_advertised: true, image: msg.offer.image } });
      return { added_to: "plan", name: msg.offer.heading };
    },
    "middagsro/plan/add": (msg) => {
      const plan = D.state.latest_plan;
      const product = msg.pantry
        ? D.pantryProducts[msg.pantry]
        : [...D.search, ...D.coffee].find((p) => p.id === msg.product_id);
      const late = msg.part === "late" ? plan.shopping.find((l) => l.buy_from)?.buy_from : null;
      const line = {
        id: `x${plan.shopping.length}`, name: product.name, amount: 1, unit: "pk", search: product.name,
        category: msg.pantry ? "Basisvarer" : "Tilføjet", added: true, pantry: msg.pantry || null, buy_from: late,
        product: { ...product }, packages: 1, cost: product.price, note: null,
      };
      plan.shopping.push(line);
      plan.total = Math.round((plan.total + product.price) * 100) / 100;
      const need = D.pantry.find((n) => n.name === msg.pantry);
      if (need) need.on_list = true;
      return line;
    },
    "middagsro/settings": (msg) => (D.state.settings = { ...D.state.settings, ...msg.settings }),
    "middagsro/day/clear": (msg) => {
      const plan = D.state.latest_plan;
      const day = plan.days.find((d) => d.date === msg.date);
      if (msg.skip) {
        plan.days = plan.days.filter((d) => d !== day);
        plan.skipped = [...(plan.skipped || []), msg.date];
      } else Object.assign(day, { dish: "", type: "tom", ingredients: [], steps: [] });
      return plan;
    },
    "middagsro/plan/line": (msg) => {
      const plan = D.state.latest_plan;
      const line = plan.shopping.find((l) => l.id === msg.line_id);
      if (msg.delete) plan.shopping = plan.shopping.filter((l) => l !== line);
      else if (msg.product_id) {
        const product = [...D.search, ...D.coffee].find((p) => p.id === msg.product_id);
        Object.assign(line, { product: { ...product }, cost: product.price * line.packages });
      } else if (msg.packages) Object.assign(line, { packages: msg.packages, cost: (line.product?.price || 0) * msg.packages });
      return plan;
    },
    "middagsro/health": () => D.health,
    "middagsro/chains": () => ({ chains: D.chains }),
    "middagsro/chains/offers": (msg) => ({ dealer_id: msg.dealer_id, offers: D.chainOffers.filter((o) => o.dealer_id === msg.dealer_id) }),
    "middagsro/chains/compare": () => D.compare,
    "middagsro/chains/products": () => ({ products: { [D.remaFavorites[0].id]: { dealer_id: "9ba51", heading: "Kaffe", price: 39, per_package: 39, saving: 10 } } }),
    "middagsro/search/everywhere": async (msg) => {
      await wait(200);
      const P = D.products;
      return {
        query: msg.query,
        products: [
          { ...D.search[0], unit_price: { unit: "l", price: 13.5 } },
          { ...D.search[1], unit_price: { unit: "l", price: 10.95 } },
        ],
        offers: [
          { ...D.chainOffers[1], unit_price: { unit: "l", price: 9.95 } },
        ],
        best: { source: "chain", id: "n2", unit_price: { unit: "l", price: 9.95 } },
      };
    },
    "middagsro/chains/add": (msg) => {
      const plan = D.state.latest_plan;
      plan.shopping.push({ id: `c${plan.shopping.length}`, name: msg.offer.heading, chain_heading: msg.offer.heading, chain_only: true,
        buy_at: msg.offer.dealer_id, chain_price: msg.offer.price, packages: 1, cost: msg.offer.price, bought: false, note: msg.offer.description });
      return plan;
    },
    "middagsro/chains/move": (msg) => {
      const plan = D.state.latest_plan;
      const line = plan.shopping.find((l) => l.id === msg.line_id);
      if (msg.dealer_id) Object.assign(line, { buy_at: msg.dealer_id, chain_price: msg.price, chain_heading: msg.heading, bought: false, cost: msg.price * line.packages });
      else delete line.buy_at;
      delete D.compare.lines[msg.line_id];
      return plan;
    },
    "middagsro/chains/line": (msg) => {
      const plan = D.state.latest_plan;
      const line = plan.shopping.find((l) => l.id === msg.line_id);
      if (msg.delete) plan.shopping = plan.shopping.filter((l) => l !== line);
      if (msg.bought != null) line.bought = msg.bought;
      if (msg.packages) Object.assign(line, { packages: msg.packages, cost: (line.chain_price || 0) * msg.packages });
      return plan;
    },
    "middagsro/recipes/get": (msg) => D.recipes.find((r) => r.id === msg.recipe_id),
    "middagsro/recipes/import": async () => {
      await wait(400);
      return { id: null, name: "Thai rød karry med kylling og ris", type: "normal", servings: 4, active_minutes: 20, total_minutes: 30, rating: null, favorite: false, source: "link",
        ingredients: [{ amount: "600 g", name: "kyllingebryst" }, { amount: "2 spsk", name: "rød karrypasta" }, { amount: "400 ml", name: "kokosmælk" }, { amount: "1", name: "rød peberfrugt" }, { amount: "300 g", name: "jasminris" }],
        steps: [{ text: "Skær kyllingen i strimler.", minutes: 5 }, { text: "Svits karrypastaen, og tilsæt kokosmælk og kylling.", minutes: 15 }], tip: "" };
    },
    "middagsro/recipes/rate": (msg) => {
      const r = D.state.recipes.find((x) => x.id === msg.recipe_id);
      if (msg.action === "favorite") Object.assign(r, r.favorite ? { favorite: false } : { favorite: true, rating: "like" });
      else if (r.rating === msg.action) Object.assign(r, { rating: null, favorite: false });
      else Object.assign(r, { rating: msg.action, favorite: msg.action === "like" ? r.favorite : false });
      return r;
    },
    "middagsro/recipes/rate_day": (msg) => {
      const day = D.state.latest_plan.days.find((d) => d.date === msg.date);
      let r = D.state.recipes.find((x) => x.id === day.recipe_id || x.name === day.dish);
      if (!r) {
        r = { id: `r${D.state.recipes.length + 1}`, name: day.dish, type: "normal", rating: null, favorite: false, source: "plan", created: new Date().toISOString(), times_planned: 1, ingredient_names: [] };
        D.state.recipes.unshift(r);
        day.recipe_id = r.id;
      }
      return handlers["middagsro/recipes/rate"]({ recipe_id: r.id, action: msg.action });
    },
    "middagsro/recipes/save": (msg) => {
      const r = { ...msg.recipe, id: msg.recipe.id || `r${D.state.recipes.length + 1}`, created: new Date().toISOString() };
      D.recipes = [r, ...D.recipes.filter((x) => x.id !== r.id)];
      D.state.recipes = [{ ...r, ingredient_names: r.ingredients.map((i) => i.name) }, ...D.state.recipes.filter((x) => x.id !== r.id)];
      return r;
    },
    "middagsro/plan/remove": (msg) => {
      const plan = D.state.latest_plan;
      plan.shopping = plan.shopping.filter((l) => l.id !== msg.line_id);
      return true;
    },
  };
  const hass = {
    language: "da",
    callWS: async (msg) => {
      await wait(5);
      const fn = handlers[msg.type];
      if (!fn) throw new Error(`No demo answer for ${msg.type}`);
      return JSON.parse(JSON.stringify(await fn(msg)));
    },
  };
  const panel = document.createElement("middagsro-panel");
  panel.panel = { config: { static_url: "../../custom_components/middagsro/frontend", version: "demo" } };
  panel.narrow = q.get("narrow") === "1";
  if (q.get("phone") === "1") {
    // Room for the status bar and the home bar, like the app on the home screen.
    panel.style.setProperty("--rema-safe-top", "50px");
    panel.style.setProperty("--rema-safe-bottom", "22px");
  }
  document.body.append(panel);
  panel.hass = hass;
  await wait(60);
  const tab = q.get("tab");
  if (tab && tab !== "plan") panel._goTab(tab);
  if (q.get("day")) {
    panel._day = Number(q.get("day"));
    panel._dayKey = panel._recipeKey();
    panel._render();
  }
  if (q.get("tick")) {
    // Show a recipe in use: some ingredients ticked off and a timer running.
    const plan = D.state.latest_plan;
    const key = `${plan.id}|${plan.days[panel._day || 0].date}`;
    for (const id of q.get("tick").split(",")) panel._checked[`${key}|${id}`] = true;
    if (q.get("timer")) panel._timers[`${key}|${q.get("timer")}`] = Date.now() + 37 * 60000 + 12000;
    panel._render();
  }
  if (tab === "favorites") await wait(80);
  if (q.get("open")) panel.shadowRoot.querySelectorAll("details").forEach((d) => (d.open = true));
  document.body.dataset.ready = "1";
</script>
</body>
</html>
