<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Middagsro – top image</title>
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
  body {
    background:
      radial-gradient(900px 600px at 12% 18%, rgba(255, 255, 255, 0.9), transparent 60%),
      radial-gradient(760px 560px at 95% 105%, rgba(255, 122, 89, 0.22), transparent 70%),
      radial-gradient(700px 520px at 60% -10%, rgba(110, 74, 255, 0.18), transparent 70%),
      linear-gradient(135deg, #f6f3ff 0%, #efe9fb 55%, #fbefea 100%);
    position: relative;
  }
  .copy { position: absolute; left: 96px; top: 150px; width: 520px; color: #1B1530; }
  .copy img { width: 360px; display: block; margin-bottom: 34px; }
  .copy h1 { font-size: 52px; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 22px; font-weight: 800; }
  .copy p { font-size: 22px; line-height: 1.45; margin: 0 0 30px; color: #463d63; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips span { font-size: 16px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: #fff; color: #3b2a8f;
    box-shadow: 0 1px 2px rgba(15, 27, 61, 0.08), 0 6px 18px rgba(15, 27, 61, 0.06); }
  .phone { position: absolute; width: 300px; height: 649px; padding: 11px; border-radius: 52px; background: #10131a;
    box-shadow: 0 2px 4px rgba(10, 20, 40, 0.18), 0 30px 70px rgba(10, 20, 40, 0.28); }
  .phone::before { content: ""; position: absolute; top: 22px; left: 50%; width: 92px; height: 26px; margin-left: -46px;
    border-radius: 20px; background: #10131a; z-index: 2; }
  .phone .bar { position: absolute; top: 26px; left: 44px; right: 40px; display: flex; justify-content: space-between; z-index: 3;
    font: 600 15px/1 Inter, system-ui, sans-serif; color: #10131a; }
  .phone.dark .bar { color: #f2f4f7; }
  .phone .bar i { width: 25px; height: 12px; border: 1.6px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
  .phone .bar i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
  .phone img { width: 100%; height: 100%; border-radius: 42px; display: block; object-fit: cover; object-position: top; }
  .p1 { left: 660px; top: 150px; transform: rotate(-4deg); }
  .p2 { left: 920px; top: 92px; z-index: 3; }
  .p3 { left: 1180px; top: 150px; transform: rotate(4deg); z-index: 2; }
</style>
</head>
<body>
  <div class="copy">
    <img src="../../custom_components/middagsro/frontend/logo.png" alt="Middagsro">
    <h1>Ro på aftensmaden.<br>Hele ugen.</h1>
    <p>AI-madplaner ud fra REMA 1000's tilbudsavis, familiens opskriftsamling, madbudgettet og indkøbslisten direkte i REMA-appen – i Home Assistant.</p>
    <div class="chips"><span>Madplan med AI</span><span>Opskriftsamling</span><span>Overrask os</span><span>Billigere andre steder</span><span>Madbudget</span></div>
  </div>
  <div class="phone p1"><span class="bar"><b>17.42</b><i></i></span><img src=".phones/plan.png" alt=""></div>
  <div class="phone p2"><span class="bar"><b>17.42</b><i></i></span><img src=".phones/recipe.png" alt=""></div>
  <div class="phone p3 dark"><span class="bar"><b>17.42</b><i></i></span><img src=".phones/budget.png" alt=""></div>
</body>
</html>
